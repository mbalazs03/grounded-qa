services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
    env_file: .env
    depends_on:
      - db
    command: sleep infinity
    ports:
      - "5000:5000"

volumes:
  pgdata:
  hf-cache: